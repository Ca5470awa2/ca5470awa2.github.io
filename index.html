<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小游戏合集</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#e8eaf6;
    background:radial-gradient(900px 520px at 50% 0%,#2f3475 0%,#14152e 55%,#08080f 100%) fixed;
    padding:0 0 40px;
    -webkit-font-smoothing:antialiased;
  }

  /* ===== 顶部 ===== */
  .top{text-align:center;padding:34px 18px 22px}
  .top .em{display:flex;justify-content:center;margin-bottom:10px}
  .top .lg{
    font-size:34px;font-weight:900;letter-spacing:7px;line-height:1.2;
    background:linear-gradient(90deg,#ffe28a,#ffb35c,#ff7bd5,#7b83ff,#6ee7ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .top .sub{font-size:11px;letter-spacing:3px;opacity:.55;margin-top:6px}
  .top .cnt{
    display:inline-block;margin-top:12px;font-size:10.5px;font-weight:800;
    padding:4px 12px;border-radius:999px;
    background:rgba(255,215,110,.14);border:1px solid rgba(255,215,110,.3);color:#ffd76e;
  }

  /* ===== 列表 ===== */
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  .secT{
    font-size:11px;font-weight:800;opacity:.5;letter-spacing:2px;
    margin:6px 0 12px;padding-left:2px;
  }

  .card{
    display:flex;gap:13px;align-items:flex-start;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    border-radius:16px;padding:14px;margin-bottom:12px;
    cursor:pointer;position:relative;overflow:hidden;
    transition:transform .16s,border-color .16s,background .16s;
  }
  .card:hover{
    transform:translateY(-2px);
    border-color:rgba(255,215,110,.38);
    background:rgba(255,255,255,.075);
  }
  .card:active{transform:translateY(0) scale(.99)}
  .card::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,#ffd76e,#ff7bd5);
  }

  .cIco{
    width:58px;height:58px;flex:none;border-radius:15px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#ffd76e,#ff9d5c);
    box-shadow:0 5px 16px rgba(255,157,92,.28);
  }
  .cMain{flex:1;min-width:0}
  .cName{font-size:16px;font-weight:900;letter-spacing:.5px}
  .cEn{font-size:9.5px;opacity:.45;letter-spacing:1.5px;margin-top:2px}
  .cDesc{
    font-size:11.5px;line-height:1.6;opacity:.72;margin-top:7px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .cTags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .tag{
    font-size:9px;font-weight:800;padding:2.5px 8px;border-radius:999px;
    background:rgba(110,231,255,.13);border:1px solid rgba(110,231,255,.24);color:#6ee7ff;
  }
  .tag.hot{background:rgba(255,123,213,.14);border-color:rgba(255,123,213,.3);color:#ff9bd5}
  .tag.gold{background:rgba(255,215,110,.14);border-color:rgba(255,215,110,.3);color:#ffd76e}
  .cFoot{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.07);
  }
  .cVer{font-size:9.5px;opacity:.5;font-weight:700}
  .cGo{
    font-size:11px;font-weight:900;padding:6px 15px;border-radius:999px;border:none;
    background:linear-gradient(135deg,#ffd98a,#ffb35c,#ff9d5c);color:#3a2405;
    box-shadow:0 3px 0 #c9832f;letter-spacing:.5px;
  }
  .cGo:active{transform:translateY(3px);box-shadow:0 0 0 #c9832f}

  /* ===== 占位卡 ===== */
  .card.soon{
    cursor:default;opacity:.42;
    border-style:dashed;border-color:rgba(255,255,255,.16);
  }
  .card.soon:hover{transform:none;background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.16)}
  .card.soon::before{background:rgba(255,255,255,.2)}
  .card.soon .cIco{
    background:rgba(255,255,255,.08);box-shadow:none;border:1px dashed rgba(255,255,255,.24);
  }

  /* ===== 底部 ===== */
  .foot{
    max-width:560px;margin:22px auto 0;padding:14px 16px 0;
    border-top:1px solid rgba(255,255,255,.08);
    font-size:10.5px;line-height:1.9;opacity:.5;text-align:center;
  }
  .foot b{color:#ffd76e;opacity:.9}

  @media (max-width:400px){
    .top .lg{font-size:28px;letter-spacing:5px}
    .cIco{width:52px;height:52px}
    .cName{font-size:15px}
  }
</style>
</head>
<body>

<div class="top">
  <div class="em">
    <svg viewBox="0 0 24 24" width="54" height="54">
      <path d="M4 20l6-6" fill="none" stroke="#ff8a8a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 4l6 6" fill="none" stroke="#c58aff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3 17l4 4 2-2-4-4z" fill="none" stroke="#ff8a8a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 3l4 4 2-2-4-4z" fill="none" stroke="#ff8a8a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6.5 13.5l4 4" fill="none" stroke="#ff8a8a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="lg">小 游 戏 合 集</div>
  <div class="sub">MINI GAMES · 一个入口，玩转全部</div>
  <div class="cnt" id="gCnt">共 0 款游戏</div>
</div>

<div class="wrap">
  <div class="secT">全部游戏</div>
  <div id="list"></div>

  <div class="secT" style="margin-top:18px">敬请期待</div>
  <div class="card soon">
    <div class="cIco">
      <svg viewBox="0 0 24 24" width="30" height="30">
        <path d="M12 5v14M5 12h14" fill="none" stroke="#9aa0c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="cMain">
      <div class="cName">新游戏</div>
      <div class="cEn">COMING SOON</div>
      <div class="cDesc">更多小游戏正在制作中，敬请期待</div>
    </div>
  </div>
</div>

<div class="foot">
  所有游戏<b>纯前端运行</b>，无需联网、无需安装<br>
  进度保存在本机浏览器，换设备可用<b>存档导出</b>带走<br>
  <span id="fVer"></span>
</div>

<script>
/* ============================================================
   游戏清单 —— 以后新增小游戏，只需在下面数组里加一项：

   {
     name:'游戏名', en:'ENGLISH NAME',
     file:'文件名.html',          // 与本页面同目录
     desc:'一句话简介',
     tags:['标签1','标签2'],       // 第 1 个标签默认高亮为金色
     ver:'v1.0',
     ico:`<svg>...</svg>`,        // 图标 SVG（白色描边，会自动着色）
     grad:'linear-gradient(135deg,#xxx,#yyy)'   // 图标底色
   }
   ============================================================ */
const GAMES = [
  {
    name:'放置英雄',
    en:'IDLE HERO',
    file:'挂机游戏.html',
    desc:'挂机放置冒险：20 个场景、21 只宠物、33 节点升级树、轮回重生与终末之诗通关。',
    tags:['放置挂机','角色扮演','收集养成'],
    ver:'v1.6.4',
    grad:'linear-gradient(135deg,#ffd76e,#ff9d5c)',
    ico:`<svg viewBox="0 0 24 24" width="30" height="30">
      <path d="M4 20l6-6" fill="none" stroke="#3a2405" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M14 4l6 6" fill="none" stroke="#3a2405" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M3 17l4 4 2-2-4-4z" fill="none" stroke="#3a2405" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 3l4 4 2-2-4-4z" fill="none" stroke="#3a2405" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`
  }
  /* ↓↓↓ 以后新增游戏就加在这里 ↓↓↓ */
];

function render(){
  const list = document.getElementById('list');
  document.getElementById('gCnt').textContent = `共 ${GAMES.length} 款游戏`;
  list.innerHTML = GAMES.map((g, i) => `
    <div class="card" data-file="${g.file}">
      <div class="cIco" style="background:${g.grad}">${g.ico}</div>
      <div class="cMain">
        <div class="cName">${g.name}</div>
        <div class="cEn">${g.en}</div>
        <div class="cDesc">${g.desc}</div>
        <div class="cTags">
          ${g.tags.map((t, k) => `<span class="tag${k === 0 ? ' gold' : (k === 1 ? ' hot' : '')}">${t}</span>`).join('')}
        </div>
        <div class="cFoot">
          <span class="cVer">${g.ver}</span>
          <button class="cGo">开始游戏</button>
        </div>
      </div>
    </div>
  `).join('');

  // 点击整张卡片打开游戏
  list.querySelectorAll('.card').forEach(c => {
    c.onclick = () => {
      const f = c.getAttribute('data-file');
      if(f) location.href = f;
    };
  });
}
render();
document.getElementById('fVer').textContent = '合集页面 v1.0';
</script>
</body>
</html>
